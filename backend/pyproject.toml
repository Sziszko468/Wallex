# Code style for the backend: `ruff check .` (lint) and `ruff format .` (formatting).
# Run them inside the dev container: docker compose exec backend ruff check .
[tool.ruff]
line-length = 120
target-version = "py313"
# Generated by Django; reformatting would only make the next makemigrations diff noisy.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused or undefined names
    "I",        # isort: import order
    "B",        # bugbear: likely bugs (raise without from, zip without strict, ...)
    "UP",       # pyupgrade: current syntax
    "SIM",      # simplifications
    "C4",       # comprehensions
    "C90",      # complexity of a function
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # too many returns / branches / arguments / statements
    "PLR2004",  # no magic numbers in comparisons: give them a name
    "RUF100",   # noqa comments that suppress nothing
]
# Long lines are the formatter's job; what it can't split (help texts, URLs, translated sentences) stays.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Keyword-only parameters read well at the call site (notify(..., title=, body=, dedupe_key=, ...)).
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests state expected numbers as literals on purpose, and arrange data with many helpers.
"**/test_*.py" = ["PLR2004", "PLR0913", "PLR0915", "C901"]
"**/tests.py" = ["PLR2004", "PLR0913", "PLR0915", "C901"]
"tests/**" = ["PLR2004", "PLR0913", "PLR0915", "C901"]
"conftest.py" = ["PLR2004", "PLR0913"]
"**/conftest.py" = ["PLR2004", "PLR0913"]
