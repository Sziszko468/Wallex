    post:
      operationId: savings_goals_create
      description: |-
        A savings goal is money put aside for something — a trip, a laptop, an emergency fund. `target_amount` and `current_amount` are in the goal's own `currency` (the currency the money is saved in) and are never converted; `base_current_amount` / `base_target_amount` show them in the user's base currency at the latest ECB rate. Goals don't create transactions and don't count as expenses: putting money aside isn't spending it.

        `status` follows the amounts: `completed` once `current_amount` reaches `target_amount`, back to `active` if it drops below. Only `archived` is the user's choice.

        Required: `name` and `target_amount`.
      summary: Create a savings goal
      tags:
      - Savings Goals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
            examples:
              JapanTrip:
                value:
                  name: Japan trip
                  target_amount: '3000.00'
                  current_amount: '1850.00'
                  target_date: '2027-04-01'
                summary: Japan trip
              InAnotherCurrency:
                value:
                  name: New laptop
                  currency: HUF
                  target_amount: '650000'
                summary: In another currency
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavingsGoalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoal'
              examples:
                Created:
                  value:
                    id: 7
                    name: Japan trip
                    currency: EUR
                    target_amount: '3000.00'
                    current_amount: '1850.00'
                    target_date: '2027-04-01'
                    status: active
                    progress_percentage: 61.67
                    remaining_amount: '1150.00'
                    days_left: 186
                    monthly_needed: '191.67'
                    base_current_amount: '1850.00'
                    base_target_amount: '3000.00'
