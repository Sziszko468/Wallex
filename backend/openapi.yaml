    post:
      operationId: budgets_create
      description: |-
        A budget caps the **expenses** of one calendar month — either for one expense category, or, with `category: null`, for all expenses together (the *overall* budget). There is at most one budget per category (or overall) per month. `spent_amount`, `remaining_amount` and `usage_percentage` are computed live from the month's expense transactions.

        If the month's spending already exceeds 80 % / 100 % of the new budget, a push notification is sent.
      summary: Create a budget
      tags:
      - Budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
            examples:
              CategoryBudget:
                value:
                  category: 206
                  amount: '60.00'
                  year: 2026
                  month: 9
                summary: Category budget
              OverallBudget:
                value:
                  category: null
                  amount: '1500.00'
                  year: 2026
                  month: 9
                summary: Overall budget
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
              examples:
                Created:
                  value:
                    id: 21
                    category: 206
                    amount: '60.00'
                    year: 2026
                    month: 9
                    spent_amount: '45.90'
                    remaining_amount: '14.10'
                    usage_percentage: 76.5
                    created_at: '2026-09-26T09:49:59.164661Z'
                    updated_at: '2026-09-26T09:49:59.164690Z'
          description: Created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                Duplicate:
                  value:
                    non_field_errors:
                    - A budget for this category and month already exists.
                IncomeCategory:
                  value:
                    category:
                    - Budgets can only be set for expense categories.
                  summary: Income category
                OutOfRange:
                  value:
                    amount:
                    - Ensure this value is greater than or equal to 0.01.
                    year:
                    - Ensure this value is greater than or equal to 2000.
                    month:
                    - Ensure this value is less than or equal to 12.
                  summary: Out of range
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
