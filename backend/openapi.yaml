        name:
          type: string
          minLength: 1
          description: What the user calls it, e.g. `Netflix`, `Gym`, `Home insurance`.
          maxLength: 100
        merchant:
          type: string
          description: 'Optional: who bills it, e.g. `Netflix International B.V.`.'
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Price of one payment in `currency`: positive, max 2 decimals
            (whole for HUF/JPY).'
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency the subscription is billed in. Default: the user's base currency. Never converted.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        category:
          type: integer
          description: Id of one of the user's **expense** categories.
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          description: |-
            Billing period, counted from `start_date`.

            * `weekly` - Weekly
            * `monthly` - Monthly
            * `yearly` - Yearly
        start_date:
          type: string
          format: date
          description: First payment; every later payment follows from it.
        end_date:
          type: string
          format: date
          nullable: true
          description: Last possible payment (inclusive), e.g. a cancelled plan; `null`
