  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Exchanges email and password for an access token (15 min) and a
        refresh token (7 days).
      summary: Log in (obtain a token pair)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LogIn:
                value:
                  email: ada@example.com
                  password: a-long-passphrase
                summary: Log in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: Logged in.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                MissingFields:
                  value:
                    email:
                    - This field is required.
                    password:
                    - This field is required.
                  summary: Missing fields
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                WrongCredentials:
                  value:
                    detail: No active account found with the given credentials
                  summary: Wrong credentials
          description: Wrong email or password, or the account is deactivated. Deliberately
            doesn't say which.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          description: Rate limit exceeded (10 attempts per minute per IP). Retry
            after the number of seconds in `Retry-After`.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token so it can never be used again.
        Only the caller's own token can be revoked. The access token stays valid until
        it expires (max 15 minutes) — clients should discard both.
      summary: Log out (revoke the refresh token)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                Success:
                  value:
                    detail: Logged out successfully.
          description: Refresh token revoked.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MissingToken:
                  value:
                    detail: Refresh token is required.
                  summary: Missing token
                InvalidToken:
                  value:
                    detail: Invalid or expired refresh token.
                  summary: Invalid token
          description: No token sent, or it is invalid, expired, already revoked or
            belongs to another user (all answered the same way).
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The profile of the user the access token belongs to. Use it to
        check a stored token on app start.
      summary: Get the signed-in user
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The signed-in user.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
