openapi: 3.0.3
info:
  title: Spendly API
  version: 1.0.0
  description: |
    REST API behind the Spendly web and mobile apps. Every business rule — validation,
    ownership, money arithmetic, analytics, insights — lives here; clients only display
    what the API returns.

    ## Quick start

    ```bash
    # 1. Create an account (no token needed)
    curl -X POST https://<host>/api/auth/register/ -H "Content-Type: application/json" \
      -d '{"email": "ada@example.com", "password": "a-long-passphrase", "password_confirm": "a-long-passphrase"}'

    # 2. Log in → {"access": "…", "refresh": "…"}
    curl -X POST https://<host>/api/auth/login/ -H "Content-Type: application/json" \
      -d '{"email": "ada@example.com", "password": "a-long-passphrase"}'

    # 3. Call the API with the access token
    curl https://<host>/api/transactions/ -H "Authorization: Bearer <access>"
    ```

    In Swagger UI: log in with *Authentication → POST /api/auth/login/ → Try it out*, copy the
    `access` value, click **Authorize** and paste it (without the `Bearer ` prefix).

    ## Authentication

    JSON Web Tokens, sent as `Authorization: Bearer <access token>`.

    | Token | Lifetime | Use |
    |---|---|---|
    | access | 15 minutes | Every authenticated request. |
    | refresh | 7 days | Only `POST /api/auth/refresh/` and `POST /api/auth/logout/`. |

    - **Refresh tokens rotate.** Every refresh returns a *new* refresh token and invalidates
      the old one. Always store the newest; replaying an old one answers
      `401 {"code": "token_not_valid"}`.
    - **Recommended client flow:** on a `401` from any endpoint, call `/api/auth/refresh/`
      once — never several in parallel, the first call already invalidates the token the
      others would send — then retry the original request. If the refresh itself fails,
      the session is over: send the user to the login screen.
    - **Logout** revokes the refresh token server-side. Access tokens can't be revoked;
      they simply expire within 15 minutes.
    - Endpoints marked with a lock need a token; `register`, `login`, `refresh` and the
      health probes don't.

    ## Conventions

    | Topic | Rule |
    |---|---|
    | Base path | Everything is under `/api/`. URLs end with a slash. |
    | Content type | `application/json`, except the two uploads (`multipart/form-data`). |
    | Money | Decimal **strings** with two decimals: `"1234.50"`. Send strings (numbers are accepted); never do money arithmetic with floats on the client — the API returns every total. |
    | Currencies | EUR, HUF, USD, GBP, JPY, CHF (whole numbers for HUF and JPY). A transaction keeps `amount` in its own `currency`; its `base_amount` is the same value in the user's **base currency** (`GET /api/auth/me/` → `base_currency`). Every total — analytics, budgets, recurring amounts — is in the base currency. Conversions use ECB reference rates, fixed when the transaction is saved. |
    | Amount sign | Amounts are always positive. `type` (`income` / `expense`) says which way the money went. A transaction's `type` must equal its category's `type`. |
    | Dates | `YYYY-MM-DD`. Timestamps: ISO 8601 in UTC (`2026-09-26T09:49:57.360831Z`). |
    | Percentages | JSON numbers (`76.5`), or `null` where they are undefined (division by zero). |
    | IDs | Integers. Referencing another user's object (e.g. a category) is a validation error; fetching it is a `404`. The two never reveal that the object exists. |
    | Partial updates | `PATCH` with only the fields to change. `PUT` (full replace) exists for transactions only. |
    | Ownership | Every resource belongs to the signed-in user. There is no way to read or change another user's data. |

    ## Pagination

    Only `GET /api/transactions/` is paginated (it can grow without bound):

    ```json
    {"count": 132, "next": "https://<host>/api/transactions/?page=3", "previous": "https://<host>/api/transactions/?page=1", "results": [ … ]}
    ```

    `?page=` starts at 1, `?page_size=` defaults to 20 (max 100). A page past the end is a
    `404`. All other lists (categories, budgets, recurring transactions, devices) are small
    and returned as plain JSON arrays.

    ## Errors

    Every error has a JSON body and a meaningful status code:

    | Status | Meaning | Body |
    |---|---|---|
    | `400` | Validation failed; nothing was saved | `{"<field>": ["message", …], "non_field_errors": ["…"]}` — one key per invalid field or query parameter |
    | `401` | Missing, invalid or expired token | `{"detail": "…"}` (+ `"code": "token_not_valid"` for bad tokens) |
    | `403` | Authenticated, but the action isn't allowed (e.g. editing a system category) | `{"detail": "…"}` |
    | `404` | No such object *for this user* | `{"detail": "…"}` |
    | `405` | HTTP method not supported on this URL | `{"detail": "…"}` |
    | `409` | The action conflicts with existing data (e.g. deleting a category in use) | `{"detail": "…"}` |
    | `413` | Upload too large | `{"<field>": ["…"]}` |
    | `429` | Rate limit hit; retry after `Retry-After` seconds | `{"detail": "…"}` |
    | `503` | A dependency is temporarily unavailable (receipt OCR, health probe) | `{"detail": "…"}` |

    Error messages are written for end users and may be shown as they are.

    ## Rate limits

    | Scope | Default limit | Keyed by |
    |---|---|---|
    | `POST /api/auth/login/` | 10 / minute | client IP |
    | `POST /api/auth/register/` | 10 / hour | client IP |
    | `POST /api/auth/refresh/` | 30 / minute | client IP |
    | `POST /api/receipts/scan/` | 30 / hour | user |
    | Everything else | 2000 / hour | user (IP when anonymous) |

    ## Idempotent transaction creation

    Clients that queue transactions offline send a `client_id` (a UUID generated once per
    transaction). Re-sending the same `client_id` answers `200` with the already stored
    transaction instead of creating a duplicate — safe to retry after a lost response.

    ## Side effects worth knowing

    Creating or updating an **expense**, importing a CSV file, or creating / lowering a
    **budget** re-checks that month's budgets. Crossing 80 % or 100 % of a budget sends a push
    notification to the user's registered mobile devices (once per budget and threshold).
paths:
  /api/achievements/:
    get:
      operationId: achievements_list
      description: |-
        Every achievement of the catalog with the user's progress, in catalog order. Evaluated on the server when requested: milestones reached since the last call are unlocked (and stored) now, and stay unlocked for good — a streak that breaks later doesn't take one back.

        - **Tracking streaks** count the days a transaction was *recorded* on (UTC), consecutive up to today or yesterday.
        - **Saved** amounts are the savings-goal total of the Savings page (goals that aren't archived), converted into `target_currency` at the latest ECB rate; without a rate the progress isn't updated.
        - **Stayed under budget** needs a finished month with tracked expenses that didn't go over one of its budgets.

        Not paginated.
      summary: List achievements
      tags:
      - Achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
              examples:
                SomeProgress:
                  value:
                  - - code: streak_7
                      name: 7 Day Tracking Streak
                      title: 7 Day Tracking Streak
                      detail: null
                      description: Record transactions on 7 days in a row.
                      icon: "\U0001F525"
                      category: tracking
                      unit: days
                      target: '7.00'
                      target_currency: null
                      progress: '7.00'
                      progress_percentage: 100.0
                      unlocked: true
                      unlocked_at: '2026-09-27T08:12:40.118273Z'
                      is_new: true
                    - code: saved_1000
                      name: €1,000 Saved
                      title: €1,000 Saved
                      detail: null
                      description: Have €1,000 in your savings goals.
                      icon: "\U0001F3C6"
                      category: saving
                      unit: money
                      target: '1000.00'
                      target_currency: EUR
                      progress: '412.50'
                      progress_percentage: 41.25
                      unlocked: false
                      unlocked_at: null
                      is_new: false
                    - code: stayed_under_budget
                      name: Stayed Under Budget
                      title: Stayed Under Food Budget
                      detail: August 2026
                      description: Finish a month without going over a budget.
                      icon: "\U0001F3AF"
                      category: budgeting
                      unit: count
                      target: '1.00'
                      target_currency: null
                      progress: '1.00'
                      progress_percentage: 100.0
                      unlocked: true
                      unlocked_at: '2026-09-01T06:02:11.500120Z'
                      is_new: false
                  summary: Some progress
          description: The catalog with progress.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/achievements/mark-seen/:
    post:
      operationId: achievements_mark_seen_create
      description: Clears `is_new` on every unlocked achievement — call it once the
        user has seen them.
      summary: Mark achievements as seen
      tags:
      - Achievements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkSeenResult'
          description: ''
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/analytics/categories/:
    get:
      operationId: analytics_categories_retrieve
      description: Each expense category's total and share of the month's expenses,
        largest first. `year` and `month` default to the current month (UTC).
      summary: Spending by category
      parameters:
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
        description: 'Month (1–12). Default: the current month.'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
        description: 'Year (2000–2100). Default: the current year.'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAnalytics'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                OutOfRange:
                  value:
                    year:
                    - Ensure this value is greater than or equal to 2000.
                    month:
                    - Ensure this value is less than or equal to 12.
                  summary: Out of range
                NotANumber:
                  value:
                    year:
                    - A valid integer is required.
                  summary: Not a number
          description: '`year` or `month` is invalid.'
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/analytics/comparison/:
    get:
      operationId: analytics_comparison_retrieve
      description: |-
        Totals of the month and of the month it is compared with, with absolute and relative differences, plus the same comparison for every expense category.

        - `against=previous_month` (default): month-over-month, e.g. September vs August.
        - `against=previous_year`: year-over-year, e.g. September 2026 vs September 2025.

        The compared month is always under `previous_month`. `year` and `month` default to the current month (UTC).
      summary: Compare a month with the previous month or year
      parameters:
      - in: query
        name: against
        schema:
          enum:
          - previous_month
          - previous_year
          type: string
          minLength: 1
        description: |-
          `previous_month` (default) or `previous_year`: the same month one year earlier.

          * `previous_month` - previous_month
          * `previous_year` - previous_year
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
        description: 'Month (1–12). Default: the current month.'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
        description: 'Year (2000–2100). Default: the current year.'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                UnknownComparison:
                  value:
                    against:
                    - '"week" is not a valid choice.'
                  summary: Unknown comparison
                BadMonth:
                  value:
                    month:
                    - Ensure this value is less than or equal to 12.
                  summary: Bad month
          description: A query parameter is invalid.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/analytics/dashboard/:
    get:
      operationId: analytics_dashboard_retrieve
      description: 'Everything a dashboard needs for one month in a single call: income,
        expenses, balance, number of transactions, the top spending category, the
        usage of every budget, with its variance (budget vs actual, and whether spending
        keeps pace with the month), and what the month''s subscriptions cost (converted
        at the rate of the month''s last day, today''s for the current month). `year`
        and `month` default to the current month (UTC).'
      summary: Monthly dashboard
      parameters:
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
        description: 'Month (1–12). Default: the current month.'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
        description: 'Year (2000–2100). Default: the current year.'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              examples:
                September:
                  value:
                    year: 2026
                    month: 9
                    total_income: '2500.00'
                    total_expenses: '845.90'
                    balance: '1654.10'
                    transaction_count: 14
                    top_spending_category:
                      category_id: 1
                      category_name: Housing
                      amount: '600.00'
                    budget_usage:
                    - budget_id: 21
                      category_id: 206
                      category_name: Gym
                      budget_amount: '60.00'
                      spent_amount: '45.90'
                      remaining_amount: '14.10'
                      usage_percentage: 76.5
                      variance_percentage: -23.5
                      expected_to_date: '40.00'
                      status: ahead_of_pace
                    - budget_id: 22
                      category_id: null
                      category_name: Overall
                      budget_amount: '1500.00'
                      spent_amount: '845.90'
                      remaining_amount: '654.10'
                      usage_percentage: 56.39
                      variance_percentage: -43.61
                      expected_to_date: '1000.00'
                      status: on_track
                    subscriptions:
                      active_count: 5
                      monthly_total: '95.96'
                      yearly_total: '1151.52'
                      due_this_month: '95.96'
                      unconverted_currencies: []
          description: Dashboard data.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                OutOfRange:
                  value:
                    year:
                    - Ensure this value is greater than or equal to 2000.
                    month:
                    - Ensure this value is less than or equal to 12.
                  summary: Out of range
                NotANumber:
                  value:
                    year:
                    - A valid integer is required.
                  summary: Not a number
          description: '`year` or `month` is invalid.'
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/analytics/insights/:
    get:
      operationId: analytics_insights_retrieve
      description: |-
        Rule-based observations about the month, most urgent first. `year` and `month` default to the current month (UTC).
        For the current month, comparisons with the previous month are month-to-date on both sides
        (e.g. 1–15 September vs 1–15 August).

        | `type` | `severity` | When | `amount` | `percentage` |
        |---|---|---|---|---|
        | `budget_exceeded` | alert | A budget's spending is above its limit | Amount over the limit | Budget usage % |
        | `budget_warning` | warning | A budget is at least 80 % used | Amount left | Budget usage % |
        | `overspending` | alert | Expenses are higher than income | Deficit | Deficit as % of income |
        | `savings` | positive | Income is higher than expenses | Amount saved | Saved % of income |
        | `category_increase` | warning | A category's spending rose by ≥ 10 % **and** ≥ 10.00 vs last month (top 3) | Increase | Change % |
        | `category_decrease` | positive | Same, but decreased | Decrease | Change % |
        | `recurring_share` | warning if ≥ 50 %, else info | Active recurring expenses (monthly equivalent) relative to income | Monthly recurring expenses | % of income |
        | `top_category` | info | The category with the highest spending | Its total | Its share of expenses % |

        Rules that need income (`overspending`, `savings`, `recurring_share`) are skipped in a month without
        income; category changes are skipped for categories with no spending last month.
      summary: Financial insights for a month
      parameters:
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
        description: 'Month (1–12). Default: the current month.'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
        description: 'Year (2000–2100). Default: the current year.'
      tags:
      - Financial Insights
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightList'
              examples:
                September:
                  value:
                    year: 2026
                    month: 9
                    insights:
                    - id: budget_exceeded:21
                      type: budget_exceeded
                      severity: alert
                      message: Gym exceeded its budget by 15%.
                      category_id: 206
                      amount: '9.00'
                      percentage: 115.0
                    - id: savings
                      type: savings
                      severity: positive
                      message: You saved 66% of your income this month.
                      category_id: null
                      amount: '1654.10'
                      percentage: 66.16
                    - id: top_category:1
                      type: top_category
                      severity: info
                      message: Highest spending category is Housing (71% of this month's
                        expenses).
                      category_id: 1
                      amount: '600.00'
                      percentage: 70.93
          description: The month's insights.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                OutOfRange:
                  value:
                    year:
                    - Ensure this value is greater than or equal to 2000.
                    month:
                    - Ensure this value is less than or equal to 12.
                  summary: Out of range
                NotANumber:
                  value:
                    year:
                    - A valid integer is required.
                  summary: Not a number
          description: '`year` or `month` is invalid.'
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
  /api/analytics/merchants/:
    get:
      operationId: analytics_merchants_retrieve
      description: The month's expenses grouped by merchant, largest first. The merchant
        is the transaction's description, compared without letter case and surrounding
        spaces; expenses without a description belong to no merchant but count in
        `total_expenses`. Each merchant is compared with the month before. `year`
        and `month` default to the current month (UTC).
      summary: Top merchants
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
        description: 'How many merchants, largest first (1–50). Default: 10.'
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
        description: 'Month (1–12). Default: the current month.'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
        description: 'Year (2000–2100). Default: the current year.'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchants'
              examples:
                September:
                  value:
                    year: 2026
                    month: 9
