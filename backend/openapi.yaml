            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit in the user''s base currency: positive, max
            2 decimals (whole for HUF/JPY).'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          minLength: 1
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
    PatchedNotificationPreferenceRequest:
      type: object
      properties:
        budget_warnings:
          type: boolean
          description: Push when a budget reaches 80 %.
        budget_exceeded:
          type: boolean
          description: Push when a budget is exceeded.
        recurring_reminders:
          type: boolean
          description: Push before an active recurring expense is due.
        insights:
          type: boolean
          description: Push for important (alert) insights such as overspending.
        recurring_reminder_days:
          type: integer
          maximum: 7
          minimum: 1
          description: How many days before a recurring expense to remind (1–7).
    PatchedRecurringTransactionRequest:
      type: object
      description: |-
        What every recurring row needs, whichever endpoint writes it (recurring transactions,
        subscriptions): only the user's own categories, a consistent schedule, an amount valid
        in its currency, and the upkeep of next_occurrence_date. Subclasses define Meta.
      properties:
        name:
          type: string
          minLength: 1
          description: Short label, e.g. `Rent`.
          maxLength: 100
        category:
          type: integer
          description: Id of one of the user's categories; its type must equal `type`.
        type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Amount per occurrence in `currency`: positive, max 2 decimals
            (whole for HUF/JPY).'
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency the amount is billed in. Default: the user's base currency. Never converted.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        merchant:
          type: string
          description: 'Optional: who gets paid (landlord, employer, provider).'
          maxLength: 100
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          description: |-
            How often it repeats, counted from `start_date`.

            * `weekly` - Weekly
            * `monthly` - Monthly
            * `yearly` - Yearly
        start_date:
          type: string
          format: date
          description: First occurrence.
        end_date:
          type: string
          format: date
          nullable: true
          description: Last possible occurrence (inclusive); `null` = no end.
        is_active:
          type: boolean
          description: '`false` pauses reminders and excludes the template from insights.'
        description:
          type: string
          description: Optional free text.
          maxLength: 255
    PatchedSavingsGoalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: What you're saving for, e.g. `Japan trip`.
          maxLength: 100
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency the money is saved in; both amounts are in it and never converted. Default: the user's base currency. Can only change while `current_amount` is 0.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'How much to save: positive, max 2 decimals (whole for HUF/JPY).'
        current_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Saved so far (default 0). Set it directly to correct it, or
            use the `deposit` / `withdraw` actions to add or remove money.
        target_date:
          type: string
          format: date
          nullable: true
          description: Optional deadline (`YYYY-MM-DD`); can't be set to a past date.
        status:
          allOf:
          - $ref: '#/components/schemas/SavingsGoalStatusEnum'
          description: |-
            `active`: still saving. `completed`: set by the server once `current_amount` reaches `target_amount` (and back to `active` if it drops below). `archived`: put away by the user. Send `archived` to archive and `active` to restore; `completed` can't be sent.

            * `active` - Active
            * `completed` - Completed
            * `archived` - Archived
    PatchedSubscriptionRequest:
      type: object
      description: |-
        What every recurring row needs, whichever endpoint writes it (recurring transactions,
