            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,10})?$
          description: 'Value of 1 unit of `currency` in the user''s base currency.
