    patch:
      operationId: auth_me_partial_update
      description: |-
        Only `base_currency` can be changed; the other fields are read-only.

        Changing it converts the user's data in one step:
        - every transaction keeps its `amount` and `currency`; its `exchange_rate` and `base_amount` are recalculated with the ECB rate of the transaction's own date;
        - budget amounts are converted at the latest rate and rounded to the new currency's unit (whole forints and yen);
        - recurring transactions, subscriptions and savings goals keep their amounts and `currency`; totals convert them.

        All or nothing: if a needed exchange rate is missing, the answer is `400` and nothing changes.
      summary: Change the base currency
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
            examples:
              SwitchToForint:
                value:
                  base_currency: HUF
                summary: Switch to forint
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                Updated:
                  value:
                    id: 42
                    email: ada@example.com
                    first_name: Ada
                    last_name: Lovelace
                    date_joined: '2026-09-21T16:06:12.123456Z'
