    post:
      operationId: receipts_scan_create
      description: |-
        Reads a receipt photo with OCR (English and Hungarian) and **suggests** the merchant, total, date and an expense category. Nothing is saved: show the suggestions to the user, let them confirm or correct them, then create the transaction with `POST /api/transactions/`.

        Each field comes with a confidence; fields that couldn't be read are `null`. The photo is processed in memory and discarded. Limited to 30 scans per hour per user.
      summary: Scan a receipt photo
      tags:
      - Receipt Scanning
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptImageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptScan'
              examples:
                GroceryReceipt:
                  value:
                    merchant:
                      value: SPAR Magyarorszag Kft
                      confidence: high
                    amount:
                      value: '1358.00'
                      confidence: high
                    date:
                      value: '2026-09-20'
                      confidence: high
                    category:
                      id: 2
                      name: Food
                      source: rules
                    text_found: true
                  summary: Grocery receipt
                UnreadablePhoto:
                  value:
                    merchant:
                      value: null
                      confidence: low
                    amount:
                      value: null
                      confidence: low
                    date:
                      value: null
                      confidence: low
                    category: null
                    text_found: false
                  summary: Unreadable photo
          description: Suggestions (possibly partial).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoImage:
                  value:
                    image:
                    - This field is required.
                  summary: No image
                NotAnImage:
                  value:
                    image:
                    - The file is not a readable image.
                  summary: Not an image
                UnsupportedFormat:
                  value:
                    image:
                    - Please upload a JPEG or PNG photo.
                  summary: Unsupported format
                ResolutionTooHigh:
                  value:
                    image:
                    - The photo's resolution is too high.
                  summary: Resolution too high
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
