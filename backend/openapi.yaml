            Currency of every total and budget. Changing it converts the user's data (see `PATCH /api/auth/me/`).

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
    Readiness:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: |-
