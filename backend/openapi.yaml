        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Must equal the category's type.

            * `income` - Income
            * `expense` - Expense
        category:
          type: integer
          description: Id of one of the user's categories.
        description:
          type: string
          description: Optional free text, max 255 characters.
          maxLength: 255
        date:
          type: string
          format: date
          description: Booking date (`YYYY-MM-DD`). Also picks the exchange rate.
        client_id:
          type: string
          format: uuid
          nullable: true
          description: Optional idempotency key (UUID) chosen by the client. Only
            settable on create.
    PatchedUserRequest:
      type: object
