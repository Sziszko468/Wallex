          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: '`amount` in the base currency; `null` without a recent exchange
            rate.'
      required:
      - amount
      - base_amount
      - currency
      - date
      - name
      - subscription_id
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          description: Registration time (UTC).
        base_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency of every total and budget. Changing it converts the user's data (see `PATCH /api/auth/me/`).

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
      required:
      - date_joined
      - email
      - first_name
      - id
      - last_name
    ValidationError:
      type: object
      description: One key per invalid field (or query parameter), each holding a
        list of messages. Problems that concern the request as a whole are under `non_field_errors`.
      properties:
        non_field_errors:
          type: array
          items:
            type: string
      additionalProperties:
        type: array
        items:
          type: string
    WeekdaySpending:
      type: object
      properties:
        weekday:
          type: integer
          description: 'ISO weekday: 1 = Monday … 7 = Sunday.'
        name:
          type: string
          description: English weekday name.
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent on this weekday.
        transaction_count:
          type: integer
        days:
          type: integer
          description: How many times this weekday occurred in the counted days.
        average_per_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          description: '`total / days`; `null` if the weekday hasn''t occurred yet.'
      required:
      - average_per_day
      - days
      - name
      - total
      - transaction_count
      - weekday
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: Register, obtain and refresh JWTs, log out.
- name: Users
  description: The signed-in user's profile.
- name: Transactions
  description: Income and expense records — the core of the API.
- name: CSV Import
  description: Bulk-create transactions from a bank export.
- name: Categories
  description: Income/expense categories, including the 10 system defaults.
- name: Budgets
  description: Monthly spending limits, overall or per category, with live usage.
- name: Savings Goals
  description: Money put aside for a goal, in its own currency, with progress.
- name: Recurring Transactions
  description: Templates for repeating income and expenses.
- name: Subscriptions
  description: Streaming, software, gym, phone… — recurring expenses with costs and
    totals.
- name: Currencies
  description: Conversion previews with ECB reference rates.
- name: Analytics
  description: Read-only monthly summaries computed on the server.
- name: Financial Insights
  description: Rule-based observations about a month's finances.
- name: Achievements
  description: Milestones earned from the user's own data, with progress.
- name: Receipt Scanning
  description: OCR suggestions from a receipt photo.
- name: Notifications
  description: Push-notification devices and preferences (mobile app).
- name: Health
  description: Liveness and readiness probes for infrastructure.
