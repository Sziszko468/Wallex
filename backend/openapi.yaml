  /api/savings-goals/:
    get:
      operationId: savings_goals_list
      description: |-
        A savings goal is money put aside for something — a trip, a laptop, an emergency fund. `target_amount` and `current_amount` are in the goal's own `currency` (the currency the money is saved in) and are never converted; `base_current_amount` / `base_target_amount` show them in the user's base currency at the latest ECB rate. Goals don't create transactions and don't count as expenses: putting money aside isn't spending it.

        `status` follows the amounts: `completed` once `current_amount` reaches `target_amount`, back to `active` if it drops below. Only `archived` is the user's choice.

        Not paginated. Active goals first, then completed, then archived; the nearest `target_date` first within each (goals without one last).
      summary: List savings goals
      tags:
      - Savings Goals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
