                  summary: Target too small
                NegativeSavedAmount:
                  value:
                    current_amount:
                    - Ensure this value is greater than or equal to 0.00.
                  summary: Negative saved amount
                FractionalForints:
                  value:
                    target_amount:
                    - HUF amounts can't have decimals.
                  summary: Fractional forints
                PastTargetDate:
                  value:
                    target_date:
                    - The target date can't be in the past.
                  summary: Past target date
                CurrencyWithSavings:
                  value:
                    currency:
                    - The currency can't change once money is saved in the goal.
                  summary: Currency with savings
                CompletedSent:
                  value:
                    status:
