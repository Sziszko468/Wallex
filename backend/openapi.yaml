  /api/currencies/convert/:
    get:
      operationId: currencies_convert_retrieve
      description: |-
        What a transaction of `amount` `currency` on `date` would be worth in the user's base currency — the same rate and `base_amount` that `POST /api/transactions/` would store. Nothing is saved; clients use it to show the converted value while the user types.

        Rates are the ECB euro reference rates of that date, or of the last publication before it (weekends, holidays) if it is at most 7 days older. Without such a rate the answer is `400`.
      summary: Preview a currency conversion
      parameters:
      - in: query
        name: amount
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description: Amount in `currency`, e.g. `15000`.
        required: true
      - in: query
        name: currency
        schema:
          enum:
          - EUR
          - HUF
          - USD
          - GBP
          - JPY
          - CHF
          type: string
          minLength: 1
        description: |-
          Currency of `amount`.

          * `EUR` - Euro
          * `HUF` - Hungarian forint
          * `USD` - US dollar
          * `GBP` - British pound
          * `JPY` - Japanese yen
          * `CHF` - Swiss franc
        required: true
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Transaction date. Default: today.'
      tags:
      - Currencies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
              examples:
                ForintToEuro:
                  value:
                    amount: '15000.00'
                    currency: HUF
                    base_currency: EUR
                    exchange_rate: '0.0025650891'
                    base_amount: '38.48'
                    rate_date: '2026-09-25'
                  summary: Forint to euro
                AlreadyInTheBaseCurrency:
                  value:
                    amount: '12.50'
                    currency: EUR
                    base_currency: EUR
                    exchange_rate: '1.0000000000'
                    base_amount: '12.50'
                    rate_date: null
                  summary: Already in the base currency
          description: The conversion.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoRateForTheDate:
                  value:
                    exchange_rate:
                    - No HUF exchange rate is available for 2026-09-26.
                  summary: No rate for the date
                FractionalForints:
                  value:
                    amount:
                    - HUF amounts can't have decimals.
                  summary: Fractional forints
                UnknownCurrency:
                  value:
                    currency:
                    - '"XYZ" is not a valid choice.'
                  summary: Unknown currency
                MissingAmount:
                  value:
                    amount:
                    - This field is required.
                  summary: Missing amount
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
