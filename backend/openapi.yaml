  /api/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Checks everything a normal request needs (database, cache). Route
        traffic here only while it answers `200`. The reason for a failure is written
        to the server log, never to the response.
      summary: Readiness probe
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: Ready to serve traffic.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              examples:
