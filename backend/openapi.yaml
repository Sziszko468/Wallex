  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Returns a new access token **and a new refresh token**; the refresh token sent is invalidated immediately (rotation). Store the new one before doing anything else.

        Clients should run at most one refresh at a time: concurrent refreshes with the same token all but one fail with `401`.
      summary: Refresh the access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: New token pair.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                MissingToken:
                  value:
                    refresh:
                    - This field is required.
                  summary: Missing token
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AlreadyUsedOrRevoked:
                  value:
                    detail: Token is blacklisted
                    code: token_not_valid
                  summary: Already used or revoked
                MalformedOrExpired:
                  value:
                    detail: Token is invalid
                    code: token_not_valid
                  summary: Malformed or expired
          description: 'The refresh token is invalid, expired, already used (tokens
            rotate) or revoked by logout. The session is over: log in again.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          description: Rate limit exceeded (30 refreshes per minute per IP). Retry
            after the number of seconds in `Retry-After`.
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Creates a user and seeds their 10 default categories (Housing, Food, Transport, Shopping, Entertainment, Health, Bills, Travel, Other as expense; Salary as income).

        Registration does **not** log the user in — call `POST /api/auth/login/` next. The email is stored lower-cased and must be unique regardless of letter case. The password must satisfy Django's validators: at least 8 characters, not too similar to the name/email, not a common password, not entirely numeric.
      summary: Create an account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              Register:
                value:
                  email: ada@example.com
                  first_name: Ada
                  last_name: Lovelace
                  password: a-long-passphrase
                  password_confirm: a-long-passphrase
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
              examples:
                Created:
                  value:
                    id: 42
                    email: ada@example.com
                    first_name: Ada
                    last_name: Lovelace
          description: Account created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmailAlreadyRegistered:
                  value:
                    email:
                    - A user with this email already exists.
                  summary: Email already registered
                InvalidEmail:
                  value:
                    email:
                    - Enter a valid email address.
                  summary: Invalid email
                WeakPassword:
                  value:
                    password:
                    - This password is too common.
                    - This password is entirely numeric.
                  summary: Weak password
                PasswordsDiffer:
                  value:
                    password_confirm:
                    - Passwords do not match.
                  summary: Passwords differ
                MissingFields:
                  value:
                    email:
                    - This field is required.
                    password:
                    - This field is required.
                  summary: Missing fields
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          description: Rate limit exceeded (10 registrations per hour per IP). Retry
            after the number of seconds in `Retry-After`.
