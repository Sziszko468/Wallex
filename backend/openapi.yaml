      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: 'Replay of an already stored `client_id`: the existing transaction.'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                Created:
                  value:
                    id: 116
                    amount: '45.90'
                    currency: EUR
                    exchange_rate: '1.0000000000'
                    base_amount: '45.90'
                    type: expense
                    category: 206
                    description: Monthly gym pass
                    date: '2026-09-12'
                    client_id: null
                    created_at: '2026-09-26T09:49:57.360831Z'
                    updated_at: '2026-09-26T09:49:57.360857Z'
          description: Created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                TypeDiffersFromCategory:
                  value:
                    type:
                    - Transaction type must match the selected category's type.
                  summary: Type differs from category
                AmountTooSmall:
                  value:
                    amount:
                    - Ensure this value is greater than or equal to 0.01.
                  summary: Amount too small
                TooManyDecimals:
                  value:
                    amount:
                    - Ensure that there are no more than 2 decimal places.
                  summary: Too many decimals
                UnknownOrForeignCategory:
                  value:
                    category:
                    - Invalid pk "999999" - object does not exist.
                  summary: Unknown or foreign category
                BadDate:
                  value:
                    date:
                    - 'Date has wrong format. Use one of these formats instead: YYYY-MM-DD.'
                  summary: Bad date
                BadClientId:
                  value:
                    client_id:
                    - Must be a valid UUID.
                  summary: Bad client_id
                UnknownCurrency:
                  value:
                    currency:
                    - '"XYZ" is not a valid choice.'
                  summary: Unknown currency
                FractionalForints:
                  value:
                    amount:
                    - HUF amounts can't have decimals.
                  summary: Fractional forints
                NoExchangeRate:
                  value:
                    exchange_rate:
                    - No HUF exchange rate is available for 2026-09-26. Enter the
                      rate manually or try again later.
                  summary: No exchange rate
                RateForTheBaseCurrency:
                  value:
                    exchange_rate:
                    - Must be 1 when the currency is your base currency.
                  summary: Rate for the base currency
                MissingFields:
                  value:
                    category:
                    - This field is required.
                    date:
                    - This field is required.
                  summary: Missing fields
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
