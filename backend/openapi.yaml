      description: |-
        * `complete` - complete
        * `incomplete` - incomplete
        * `unsupported` - unsupported
        * `unreadable` - unreadable
    ReceiptScan:
      type: object
      properties:
        merchant:
          $ref: '#/components/schemas/ScannedText'
        amount:
          $ref: '#/components/schemas/ScannedAmount'
        date:
          $ref: '#/components/schemas/ScannedDate'
        currency:
          $ref: '#/components/schemas/ScannedCurrency'
        unsupported_currency:
          type: string
          nullable: true
          description: An ISO code printed on the receipt that Spendly can't record
            (e.g. `CZK`), when no supported one was found; the user has to choose
            the currency and amount themselves. Otherwise `null`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'
          description: Purchased lines above the total, as read (at most 50). For
            display only — the total is not a sum of them.
        category:
          allOf:
          - $ref: '#/components/schemas/SuggestedCategory'
          nullable: true
          description: Suggested expense category, if any.
        text_found:
          type: boolean
          description: '`false` if the photo contained no readable text at all.'
        outcome:
          allOf:
          - $ref: '#/components/schemas/ReceiptOutcomeEnum'
          description: |-
            `complete`: merchant, total, date and currency found. `incomplete`: a receipt with fields missing — let the user fill them in. `unsupported`: text, but neither a total nor a date (not a receipt, or a layout we can't read). `unreadable`: no text at all (blurry, dark photo).

            * `complete` - complete
            * `incomplete` - incomplete
            * `unsupported` - unsupported
            * `unreadable` - unreadable
      required:
      - amount
      - category
      - currency
      - date
      - items
      - merchant
      - outcome
      - text_found
      - unsupported_currency
