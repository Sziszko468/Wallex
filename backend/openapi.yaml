  /api/transactions/import/:
    post:
      operationId: transactions_import_create
      description: |-
        Creates transactions from a bank-export style CSV file (`multipart/form-data`, field `file`).

        **Format** — a header row with (at least) these columns, in any order and letter case; other columns are ignored:

        ```csv
        date,description,amount
        2026-09-03,Tesco groceries,-23.40
        03/09/2026,Salary,"2,500.00"
        ```

        | Column | Rules |
        |---|---|
        | `date` | `YYYY-MM-DD` or `DD/MM/YYYY` |
        | `amount` | Signed decimal with a **dot** as decimal separator. Negative = expense, positive = income, zero is rejected. Thousands separators (`,` and spaces) and `€ $ £` are removed. |
        | `description` | Free text, max 255 characters. Also used to pick the category. |

        **Category detection:** keyword rules on the description map each row to one of the user's categories
        (e.g. *Tesco* → Food, *Salary* → Salary). Unmatched expenses go to **Other**; unmatched income rows fail.

        **Duplicates:** a row with the same date, amount and description (ignoring case) as an existing
        transaction — or an earlier row of the same file — is `skipped`.

        **Outcome:** row problems don't stop the import: every valid row is saved and every other row is
        reported in `details` (status `200` even if some rows failed). Problems with the file itself (not CSV,
        missing columns, too many rows, empty, binary, unreadable encoding) reject the whole upload with `400`
        and nothing is saved. UTF-8 (with or without BOM) and Latin-1 are accepted.

        Imported expenses re-check the affected months' budgets (push notifications as usual).
      summary: Import transactions from CSV
      tags:
      - CSV Import
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResult'
              examples:
                MixedResult:
                  value:
                    imported: 2
                    skipped: 1
                    failed: 2
                    details:
                    - row: 4
                      status: failed
                      reason: Could not detect a category for 'Mystery income'.
                    - row: 5
                      status: failed
                      reason: Unrecognized amount 'abc'.
                    - row: 6
                      status: skipped
                      reason: Duplicate of an existing transaction.
                  summary: Mixed result
          description: Import finished (possibly with skipped or failed rows).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoFile:
                  value:
                    file:
                    - This field is required.
                  summary: No file
                NotA.csvFile:
                  value:
                    file:
                    - Please upload a .csv file.
                  summary: Not a .csv file
                MissingColumns:
                  value:
                    file:
                    - 'Missing required column(s): amount, date, description.'
                  summary: Missing columns
                TooManyRows:
                  value:
                    file:
                    - Too many rows — at most 5000 per import.
                  summary: Too many rows
                EmptyFile:
                  value:
                    file:
                    - The uploaded file is empty.
                  summary: Empty file
                BinaryFile:
                  value:
                    file:
                    - This doesn't look like a CSV file (it contains binary data).
                  summary: Binary file
          description: The file as a whole was rejected; nothing was imported.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                TooLarge:
                  value:
                    file:
                    - The file is too large (max 2 MB).
                  summary: Too large
          description: The upload is larger than 2 MB.
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
components:
  schemas:
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
          description: Expense category id, or `null` for the overall budget of all
            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit: positive, max 2 decimals.'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
        spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Expenses counted against this budget so far.
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: '`amount - spent_amount`; negative when over budget.'
        usage_percentage:
          type: number
          format: double
          readOnly: true
          description: '`spent_amount / amount × 100`, rounded to 2 decimals; above
            100 when over budget.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - month
      - remaining_amount
      - spent_amount
      - updated_at
      - usage_percentage
      - year
    BudgetRequest:
      type: object
      properties:
        category:
          type: integer
          nullable: true
          description: Expense category id, or `null` for the overall budget of all
            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit: positive, max 2 decimals.'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
      required:
      - amount
      - month
      - year
    BudgetUsage:
      type: object
      properties:
        budget_id:
          type: integer
        category_id:
          type: integer
          nullable: true
          description: '`null` for the overall budget.'
        category_name:
          type: string
          description: The category name, or `"Overall"`.
        budget_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: The monthly limit.
        spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent so far this month.
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Negative when over budget.
        usage_percentage:
          type: number
          format: double
          description: '`spent / budget × 100`; above 100 when over budget.'
      required:
      - budget_amount
      - budget_id
      - category_id
      - category_name
      - remaining_amount
      - spent_amount
      - usage_percentage
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
        is_system:
          type: boolean
          readOnly: true
          description: 'True for the 10 defaults created at registration: they can''t
            be changed or deleted.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_system
      - name
      - type
      - updated_at
    CategoryAnalytics:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryShare'
          description: Expense categories with spending, largest first.
      required:
      - categories
      - month
      - year
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          minLength: 1
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
      required:
      - name
      - type
    CategoryShare:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent in this category.
        percentage:
          type: number
          format: double
          description: Share of the month's total expenses, 0–100.
      required:
      - amount
      - category_id
      - category_name
      - percentage
    Comparison:
      type: object
      properties:
        current_month:
          $ref: '#/components/schemas/MonthSummary'
        previous_month:
          $ref: '#/components/schemas/MonthSummary'
        difference:
          allOf:
          - $ref: '#/components/schemas/ComparisonValues'
          description: Absolute change, current minus previous.
        percentage_difference:
          allOf:
          - $ref: '#/components/schemas/ComparisonPercentages'
          description: Change relative to the previous month; `null` where the previous
            value was 0.
      required:
      - current_month
      - difference
      - percentage_difference
      - previous_month
    ComparisonPercentages:
      type: object
      properties:
        total_income:
          type: number
          format: double
          nullable: true
        total_expenses:
          type: number
          format: double
          nullable: true
        balance:
          type: number
          format: double
          nullable: true
      required:
      - balance
      - total_expenses
      - total_income
    ComparisonValues:
      type: object
      properties:
        total_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
      required:
      - balance
      - total_expenses
      - total_income
    CsvImportRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The `.csv` file (max 2 MB, 5000 data rows).
      required:
      - file
    CsvImportResult:
      type: object
      properties:
        imported:
          type: integer
          description: Transactions created.
        skipped:
          type: integer
          description: Rows ignored as duplicates.
        failed:
          type: integer
          description: Rows that couldn't be imported.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowResult'
          description: One entry per skipped or failed row, in file order. Imported
            rows aren't listed.
      required:
      - details
      - failed
      - imported
      - skipped
    Dashboard:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of income transactions.
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of expense transactions.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`total_income - total_expenses`; negative when overspent.'
        transaction_count:
          type: integer
        top_spending_category:
          allOf:
          - $ref: '#/components/schemas/TopCategory'
          nullable: true
          description: The expense category with the highest total; `null` without
            expenses.
        budget_usage:
          type: array
          items:
            $ref: '#/components/schemas/BudgetUsage'
          description: Every budget of the month.
      required:
      - balance
      - budget_usage
      - month
      - top_spending_category
      - total_expenses
      - total_income
      - transaction_count
      - year
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        expo_push_token:
          type: string
          description: From `Notifications.getExpoPushTokenAsync()`, e.g. `ExponentPushToken[…]`.
          maxLength: 255
        platform:
          allOf:
          - $ref: '#/components/schemas/DevicePlatformEnum'
          description: |-
            `ios` or `android`.

            * `ios` - iOS
            * `android` - Android
        name:
          type: string
          description: Optional label shown to the user, e.g. the phone model.
          maxLength: 100
        is_active:
          type: boolean
          readOnly: true
          description: False once Expo reported the token as no longer registered.
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          description: Last registration from this device (every signed-in app start).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expo_push_token
      - id
      - is_active
      - last_seen_at
      - platform
    DevicePlatformEnum:
      enum:
      - ios
      - android
      type: string
      description: |-
        * `ios` - iOS
        * `android` - Android
    DeviceRequest:
      type: object
      properties:
        expo_push_token:
          type: string
          minLength: 1
          description: From `Notifications.getExpoPushTokenAsync()`, e.g. `ExponentPushToken[…]`.
          maxLength: 255
        platform:
          allOf:
          - $ref: '#/components/schemas/DevicePlatformEnum'
          description: |-
            `ios` or `android`.

            * `ios` - iOS
            * `android` - Android
        name:
          type: string
          description: Optional label shown to the user, e.g. the phone model.
          maxLength: 100
      required:
      - expo_push_token
      - platform
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable message; safe to show to the user.
        code:
          type: string
          description: Machine-readable reason, e.g. `token_not_valid` for a bad or
            expired JWT.
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: 'JWT errors only: why each token type rejected the token.'
      required:
      - detail
    FrequencyEnum:
      enum:
      - weekly
      - monthly
      - yearly
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
        * `yearly` - Yearly
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    ImportRowResult:
      type: object
      properties:
        row:
          type: integer
          description: Line number in the file; the header is line 1.
        status:
          allOf:
          - $ref: '#/components/schemas/ImportRowStatusEnum'
          description: |-
            `skipped`: duplicate, not an error. `failed`: the row couldn't be imported (see `reason`).

            * `skipped` - skipped
            * `failed` - failed
        reason:
          type: string
          description: Human-readable explanation, safe to show.
      required:
      - reason
      - row
      - status
    ImportRowStatusEnum:
      enum:
      - skipped
      - failed
      type: string
      description: |-
        * `skipped` - skipped
        * `failed` - failed
    Insight:
      type: object
      properties:
        id:
          type: string
          description: Stable id of this observation (e.g. `budget_exceeded:21`);
            use it as a list key or to remember which insights the user dismissed.
        type:
          allOf:
          - $ref: '#/components/schemas/InsightTypeEnum'
          description: |-
            What was observed (see the table above).

            * `top_category` - top_category
            * `category_increase` - category_increase
            * `category_decrease` - category_decrease
            * `budget_exceeded` - budget_exceeded
            * `budget_warning` - budget_warning
            * `recurring_share` - recurring_share
            * `overspending` - overspending
            * `savings` - savings
        severity:
          allOf:
          - $ref: '#/components/schemas/InsightSeverityEnum'
          description: |-
            `alert` > `warning` > `positive` > `info`; the list is sorted by it.

            * `alert` - alert
            * `warning` - warning
            * `positive` - positive
            * `info` - info
        message:
          type: string
          description: English sentence for the user. Contains no currency symbol.
        category_id:
          type: integer
          nullable: true
          description: The category concerned, if any.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          description: The amount the insight is about (see the table); `null` if
            none.
        percentage:
          type: number
          format: double
          nullable: true
          description: The percentage the insight is about; `null` if none.
      required:
      - amount
      - category_id
      - id
      - message
      - percentage
      - severity
      - type
    InsightList:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
          description: Most urgent first. Empty when there is nothing to say.
      required:
      - insights
      - month
      - year
    InsightSeverityEnum:
      enum:
      - alert
      - warning
      - positive
      - info
      type: string
      description: |-
        * `alert` - alert
        * `warning` - warning
        * `positive` - positive
        * `info` - info
    InsightTypeEnum:
      enum:
      - top_category
      - category_increase
      - category_decrease
      - budget_exceeded
      - budget_warning
      - recurring_share
      - overspending
      - savings
      type: string
      description: |-
        * `top_category` - top_category
        * `category_increase` - category_increase
        * `category_decrease` - category_decrease
        * `budget_exceeded` - budget_exceeded
        * `budget_warning` - budget_warning
        * `recurring_share` - recurring_share
        * `overspending` - overspending
        * `savings` - savings
    Liveness:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: |-
            Always `ok`.

            * `ok` - ok
            * `error` - error
      required:
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Case-insensitive.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Message:
      type: object
      properties:
        detail:
          type: string
          description: Confirmation message.
      required:
      - detail
    MonthSummary:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of income transactions.
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of expense transactions.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`total_income - total_expenses`; negative when overspent.'
        transaction_count:
          type: integer
      required:
      - balance
      - month
      - total_expenses
      - total_income
      - transaction_count
      - year
    MonthlyAnalytics:
      type: object
      properties:
        year:
          type: integer
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyEntry'
          description: Always 12 entries, January first; empty months are zero.
      required:
      - months
      - year
    MonthlyEntry:
      type: object
      properties:
        month:
          type: integer
          description: 1–12.
        month_name:
          type: string
          description: English month name.
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Income that month.
        expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Expenses that month.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`income - expenses`.'
      required:
      - balance
      - expenses
      - income
      - month
      - month_name
    NotificationPreference:
      type: object
      properties:
        budget_warnings:
          type: boolean
          description: Push when a budget reaches 80 %.
        budget_exceeded:
          type: boolean
          description: Push when a budget is exceeded.
        recurring_reminders:
          type: boolean
          description: Push before an active recurring expense is due.
        insights:
          type: boolean
          description: Push for important (alert) insights such as overspending.
        recurring_reminder_days:
          type: integer
          maximum: 7
          minimum: 1
          description: How many days before a recurring expense to remind (1–7).
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    OcrConfidenceEnum:
      enum:
      - high
      - low
      type: string
      description: |-
        * `high` - high
        * `low` - low
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PatchedBudgetRequest:
      type: object
      properties:
        category:
          type: integer
          nullable: true
          description: Expense category id, or `null` for the overall budget of all
            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit: positive, max 2 decimals.'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          minLength: 1
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
    PatchedNotificationPreferenceRequest:
      type: object
      properties:
        budget_warnings:
          type: boolean
          description: Push when a budget reaches 80 %.
        budget_exceeded:
          type: boolean
          description: Push when a budget is exceeded.
        recurring_reminders:
          type: boolean
