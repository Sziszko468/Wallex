  /api/devices/:
    get:
      operationId: devices_list
      description: |-
        The user's registered app installations, most recently seen first. Not paginated.

        **Mobile only** — the web client never registers a device. Delivery goes through the Expo push service.

        Every push carries `data` with `kind`, `notification_id` and the `screen` to open on tap:

        | `kind` | Sent when | At most once per | `data.screen` |
        |---|---|---|---|
        | `budget_warning` | An expense or budget change brings a budget to ≥ 80 % (and ≤ 100 %) | budget | `budgets` |
        | `budget_exceeded` | … above 100 % (the warning is skipped if both happen at once) | budget | `budgets` |
        | `recurring_due` | An active recurring expense is due within `recurring_reminder_days` | recurring item + date | `recurring` |
        | `insight` | An `alert` insight other than a budget one (e.g. `overspending`) | insight + month | `dashboard` |

        Devices that haven't re-registered for longer than the refresh-token lifetime (7 days) are not sent to.
      summary: List push devices
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
    post:
      operationId: devices_create
      description: Call on every signed-in app start (after the OS granted notification
        permission). **Idempotent on the token:** an already registered token is updated
        (`200`) — refreshing `last_seen_at` and re-activating it — instead of creating
        a duplicate. A token registered by another account moves to the caller (same
        phone, different user).
      summary: Register this device for push
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
            examples:
              Register:
                value:
                  expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                  platform: android
                  name: Pixel 8
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: 'Token already known: updated.'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                Registered:
                  value:
                    id: 4
                    expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                    platform: android
                    name: Pixel 8
                    is_active: true
                    last_seen_at: '2026-09-26T09:50:01.957921Z'
                    created_at: '2026-09-26T09:50:01.993330Z'
          description: New device registered.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidToken:
                  value:
                    expo_push_token:
                    - Not a valid Expo push token.
                  summary: Invalid token
                UnknownPlatform:
                  value:
                    platform:
                    - '"windows" is not a valid choice.'
                  summary: Unknown platform
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
