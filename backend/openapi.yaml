  /api/transactions/import/:
    post:
      operationId: transactions_import_create
      description: |-
        Creates transactions from a bank-export style CSV file (`multipart/form-data`, field `file`).

        **Format** — a header row with (at least) these columns, in any order and letter case; other columns are ignored:

        ```csv
        date,description,amount
        2026-09-03,Tesco groceries,-23.40
        03/09/2026,Salary,"2,500.00"
        ```

        | Column | Rules |
        |---|---|
        | `date` | `YYYY-MM-DD` or `DD/MM/YYYY` |
        | `amount` | Signed decimal with a **dot** as decimal separator, in the user's **base currency**. Negative = expense, positive = income, zero is rejected; whole numbers for HUF and JPY. Thousands separators (`,` and spaces) and `€ $ £` are removed. |
        | `description` | Free text, max 255 characters. Also used to pick the category. |

        **Category detection:** keyword rules on the description map each row to one of the user's categories
        (e.g. *Tesco* → Food, *Salary* → Salary). Unmatched expenses go to **Other**; unmatched income rows fail.

        **Duplicates:** a row with the same date, amount and description (ignoring case) as an existing
        transaction — or an earlier row of the same file — is `skipped`.

        **Outcome:** row problems don't stop the import: every valid row is saved and every other row is
        reported in `details` (status `200` even if some rows failed). Problems with the file itself (not CSV,
        missing columns, too many rows, empty, binary, unreadable encoding) reject the whole upload with `400`
        and nothing is saved. UTF-8 (with or without BOM) and Latin-1 are accepted.

        Imported expenses re-check the affected months' budgets (push notifications as usual).
      summary: Import transactions from CSV
      tags:
      - CSV Import
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportResult'
              examples:
                MixedResult:
                  value:
                    imported: 2
                    skipped: 1
                    failed: 2
                    details:
                    - row: 4
                      status: failed
                      reason: Could not detect a category for 'Mystery income'.
                    - row: 5
                      status: failed
                      reason: Unrecognized amount 'abc'.
                    - row: 6
                      status: skipped
                      reason: Duplicate of an existing transaction.
                  summary: Mixed result
          description: Import finished (possibly with skipped or failed rows).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoFile:
                  value:
                    file:
                    - This field is required.
                  summary: No file
                NotA.csvFile:
                  value:
                    file:
                    - Please upload a .csv file.
                  summary: Not a .csv file
                MissingColumns:
                  value:
                    file:
                    - 'Missing required column(s): amount, date, description.'
                  summary: Missing columns
                TooManyRows:
                  value:
                    file:
                    - Too many rows — at most 5000 per import.
                  summary: Too many rows
                EmptyFile:
                  value:
                    file:
                    - The uploaded file is empty.
                  summary: Empty file
                BinaryFile:
                  value:
                    file:
                    - This doesn't look like a CSV file (it contains binary data).
                  summary: Binary file
          description: The file as a whole was rejected; nothing was imported.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                TooLarge:
                  value:
                    file:
                    - The file is too large (max 2 MB).
                  summary: Too large
          description: The upload is larger than 2 MB.
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
components:
  schemas:
    Achievement:
      type: object
      description: One achievement with the user's progress. Serializes a UserAchievement.
      properties:
        code:
          type: string
          description: Stable identifier, e.g. `streak_7`.
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: Catalog name, e.g. `Stayed Under Budget`.
        title:
          type: string
          description: 'What to show: the name, or how it was earned once unlocked
            — e.g. `Stayed Under Food Budget`.'
        detail:
          type: string
          nullable: true
          description: Once unlocked, what it was earned with (`August 2026`, a goal's
            name); else `null`.
        description:
          type: string
          description: How to earn it.
        icon:
          type: string
          description: An emoji.
        category:
          $ref: '#/components/schemas/AchievementCategoryEnum'
        unit:
          allOf:
          - $ref: '#/components/schemas/AchievementUnitEnum'
          description: |-
            What `progress` and `target` count: `count`, `days` or `money`.

            * `count` - Count
            * `days` - Days
            * `money` - Money
        target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The value to reach.
        target_currency:
          nullable: true
          description: |-
            Currency of `target` and `progress` for `money`; else `null`.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/NullEnum'
        progress:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Current value towards `target` (a streak's current length,
            money saved…); equals `target` once unlocked.
        progress_percentage:
          type: number
          format: double
          description: '`progress / target × 100`, 0–100.'
        unlocked:
          type: boolean
        unlocked_at:
          type: string
          format: date-time
          nullable: true
          description: When it was unlocked; `null` while locked.
        is_new:
          type: boolean
          description: Unlocked but not shown to the user yet (see `mark-seen`).
      required:
      - category
      - code
      - description
      - detail
      - icon
      - is_new
      - name
      - progress
      - progress_percentage
      - target
      - target_currency
      - title
      - unit
      - unlocked
      - unlocked_at
    AchievementCategoryEnum:
      enum:
      - tracking
      - saving
      - budgeting
      type: string
      description: |-
        * `tracking` - Tracking
        * `saving` - Saving
        * `budgeting` - Budgeting
    AchievementUnitEnum:
      enum:
      - count
      - days
      - money
      type: string
      description: |-
        * `count` - Count
        * `days` - Days
        * `money` - Money
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
          description: Expense category id, or `null` for the overall budget of all
            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit in the user''s base currency: positive, max
            2 decimals (whole for HUF/JPY).'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
        spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Expenses counted against this budget so far.
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: '`amount - spent_amount`; negative when over budget.'
        usage_percentage:
          type: number
          format: double
          readOnly: true
          description: '`spent_amount / amount × 100`, rounded to 2 decimals; above
            100 when over budget.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - month
      - remaining_amount
      - spent_amount
      - updated_at
      - usage_percentage
      - year
    BudgetRequest:
      type: object
      properties:
        category:
          type: integer
          nullable: true
          description: Expense category id, or `null` for the overall budget of all
            expenses.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Monthly limit in the user''s base currency: positive, max
            2 decimals (whole for HUF/JPY).'
        year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 2000–2100.
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: 1–12.
      required:
      - amount
      - month
      - year
    BudgetStatusEnum:
      enum:
      - on_track
      - ahead_of_pace
      - over_budget
      type: string
      description: |-
        * `on_track` - on_track
        * `ahead_of_pace` - ahead_of_pace
        * `over_budget` - over_budget
    BudgetUsage:
      type: object
      properties:
        budget_id:
          type: integer
        category_id:
          type: integer
          nullable: true
          description: '`null` for the overall budget.'
        category_name:
          type: string
          description: The category name, or `"Overall"`.
        budget_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: The monthly limit.
        spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent so far this month.
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Negative when over budget.
        usage_percentage:
          type: number
          format: double
          description: '`spent / budget × 100`; above 100 when over budget.'
        variance_percentage:
          type: number
          format: double
          description: 'Budget variance: how far spending is above (+) or below (−)
            the limit, in % of the limit.'
        expected_to_date:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: 'What the budget allows by today when spread evenly over the
            month: the full limit for a past month, 0 for a future one.'
        status:
          allOf:
          - $ref: '#/components/schemas/BudgetStatusEnum'
          description: |-
            `over_budget`: above the limit. `ahead_of_pace`: above `expected_to_date` but not the limit yet. `on_track`: otherwise.

            * `on_track` - on_track
            * `ahead_of_pace` - ahead_of_pace
            * `over_budget` - over_budget
      required:
      - budget_amount
      - budget_id
      - category_id
      - category_name
      - expected_to_date
      - remaining_amount
      - spent_amount
      - status
      - usage_percentage
      - variance_percentage
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
        is_system:
          type: boolean
          readOnly: true
          description: 'True for the 10 defaults created at registration: they can''t
            be changed or deleted.'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_system
      - name
      - type
      - updated_at
    CategoryAnalytics:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryShare'
          description: Expense categories with spending, largest first.
      required:
      - categories
      - month
      - year
    CategoryComparison:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        current_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent in the selected month.
        previous_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent in the month compared against.
        change_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`current_amount - previous_amount`.'
        change_percentage:
          type: number
          format: double
          nullable: true
          description: '`null` when nothing was spent before.'
      required:
      - category_id
      - category_name
      - change_amount
      - change_percentage
      - current_amount
      - previous_amount
    CategoryCost:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        monthly_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: What the category's active subscriptions cost per month, in
            the base currency.
        subscription_count:
          type: integer
        percentage:
          type: number
          format: double
          nullable: true
          description: Share of the summary's `monthly_total`, 0–100; `null` when
            that is 0.
      required:
      - category_id
      - category_name
      - monthly_total
      - percentage
      - subscription_count
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Unique per user and type, ignoring letter case.
          maxLength: 100
        type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          description: |-
            Transactions in this category must have the same type.

            * `income` - Income
            * `expense` - Expense
        color:
          type: string
          minLength: 1
          description: Hex colour `#RRGGBB`, used in charts. Default `#6366F1`.
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        icon:
          type: string
          description: Optional icon name for the clients.
          maxLength: 50
      required:
      - name
      - type
    CategoryShare:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent in this category.
        percentage:
          type: number
          format: double
          description: Share of the month's total expenses, 0–100.
      required:
      - amount
      - category_id
      - category_name
      - percentage
    CategoryTrend:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
        amounts:
          type: array
          items:
            type: string
            format: decimal
            pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
            description: Spent that month.
          description: One amount per month of `months`, in the same order.
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent over the whole window.
        average:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`total / number of months`.'
        change_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: The latest month minus the month before it.
        change_percentage:
          type: number
          format: double
          nullable: true
          description: The latest month against the month before it; `null` without
            spending before.
      required:
      - amounts
      - average
      - category_id
      - category_name
      - change_amount
      - change_percentage
      - total
    Comparison:
      type: object
      properties:
        against:
          allOf:
          - $ref: '#/components/schemas/ComparisonAgainstEnum'
          description: |-
            What the month is compared with.

            * `previous_month` - previous_month
            * `previous_year` - previous_year
        current_month:
          $ref: '#/components/schemas/MonthSummary'
        previous_month:
          allOf:
          - $ref: '#/components/schemas/MonthSummary'
          description: 'The month compared against: the previous month, or the same
            month a year earlier.'
        difference:
          allOf:
          - $ref: '#/components/schemas/ComparisonValues'
          description: Absolute change, current minus previous.
        percentage_difference:
          allOf:
          - $ref: '#/components/schemas/ComparisonPercentages'
          description: Change relative to the month compared against; `null` where
            its value was 0.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryComparison'
          description: Expense categories with spending in either month, largest current
            spending first.
      required:
      - against
      - categories
      - current_month
      - difference
      - percentage_difference
      - previous_month
    ComparisonAgainstEnum:
      enum:
      - previous_month
      - previous_year
      type: string
      description: |-
        * `previous_month` - previous_month
        * `previous_year` - previous_year
    ComparisonPercentages:
      type: object
      properties:
        total_income:
          type: number
          format: double
          nullable: true
        total_expenses:
          type: number
          format: double
          nullable: true
        balance:
          type: number
          format: double
          nullable: true
      required:
      - balance
      - total_expenses
      - total_income
    ComparisonValues:
      type: object
      properties:
        total_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Current minus previous month.
      required:
      - balance
      - total_expenses
      - total_income
    Conversion:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The amount sent.
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        base_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The user's base currency.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,10})?$
          description: Value of 1 unit of `currency` in `base_currency`.
        base_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: '`amount × exchange_rate`, rounded to cents — what a transaction
            would store.'
        rate_date:
          type: string
          format: date
          nullable: true
          description: Date of the ECB publication used (the last one on or before
            `date`); `null` for the base currency.
      required:
      - amount
      - base_amount
      - base_currency
      - currency
      - exchange_rate
      - rate_date
    CsvImportRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The `.csv` file (max 2 MB, 5000 data rows).
      required:
      - file
    CsvImportResult:
      type: object
      properties:
        imported:
          type: integer
          description: Transactions created.
        skipped:
          type: integer
          description: Rows ignored as duplicates.
        failed:
          type: integer
          description: Rows that couldn't be imported.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowResult'
          description: One entry per skipped or failed row, in file order. Imported
            rows aren't listed.
      required:
      - details
      - failed
      - imported
      - skipped
    CurrencyEnum:
      enum:
      - EUR
      - HUF
      - USD
      - GBP
      - JPY
      - CHF
      type: string
      description: |-
        * `EUR` - Euro
        * `HUF` - Hungarian forint
        * `USD` - US dollar
        * `GBP` - British pound
        * `JPY` - Japanese yen
        * `CHF` - Swiss franc
    Dashboard:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of income transactions.
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Sum of expense transactions.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`total_income - total_expenses`; negative when overspent.'
        transaction_count:
          type: integer
        top_spending_category:
          allOf:
          - $ref: '#/components/schemas/TopCategory'
          nullable: true
          description: The expense category with the highest total; `null` without
            expenses.
        budget_usage:
          type: array
          items:
            $ref: '#/components/schemas/BudgetUsage'
          description: Every budget of the month.
        subscriptions:
          allOf:
          - $ref: '#/components/schemas/DashboardSubscriptions'
          description: The month's subscriptions (see `/api/subscriptions/`), in the
            base currency.
      required:
      - balance
      - budget_usage
      - month
      - subscriptions
      - top_spending_category
      - total_expenses
      - total_income
      - transaction_count
      - year
    DashboardSubscriptions:
      type: object
      properties:
        active_count:
          type: integer
          description: Subscriptions active at some point during the month.
        monthly_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: What they cost per month (weekly × 52 / 12, yearly / 12).
        yearly_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: 'What they cost per year: the yearly projection.'
        due_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: The payments scheduled within this month (a yearly plan only
            counts in its billing month).
        unconverted_currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          description: Currencies without a recent ECB rate; subscriptions billed
            in them are left out.
      required:
      - active_count
      - due_this_month
      - monthly_total
      - unconverted_currencies
      - yearly_total
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        expo_push_token:
          type: string
          description: From `Notifications.getExpoPushTokenAsync()`, e.g. `ExponentPushToken[…]`.
          maxLength: 255
        platform:
          allOf:
          - $ref: '#/components/schemas/DevicePlatformEnum'
          description: |-
            `ios` or `android`.

            * `ios` - iOS
            * `android` - Android
        name:
          type: string
          description: Optional label shown to the user, e.g. the phone model.
          maxLength: 100
        is_active:
          type: boolean
          readOnly: true
          description: False once Expo reported the token as no longer registered.
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          description: Last registration from this device (every signed-in app start).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expo_push_token
      - id
      - is_active
      - last_seen_at
      - platform
    DevicePlatformEnum:
      enum:
      - ios
      - android
      type: string
      description: |-
        * `ios` - iOS
        * `android` - Android
    DeviceRequest:
      type: object
      properties:
        expo_push_token:
          type: string
          minLength: 1
          description: From `Notifications.getExpoPushTokenAsync()`, e.g. `ExponentPushToken[…]`.
          maxLength: 255
        platform:
          allOf:
          - $ref: '#/components/schemas/DevicePlatformEnum'
          description: |-
            `ios` or `android`.

            * `ios` - iOS
            * `android` - Android
        name:
          type: string
          description: Optional label shown to the user, e.g. the phone model.
          maxLength: 100
      required:
      - expo_push_token
      - platform
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable message; safe to show to the user.
        code:
          type: string
          description: Machine-readable reason, e.g. `token_not_valid` for a bad or
            expired JWT.
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: 'JWT errors only: why each token type rejected the token.'
      required:
      - detail
    FrequencyEnum:
      enum:
      - weekly
      - monthly
      - yearly
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
        * `yearly` - Yearly
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    ImportRowResult:
      type: object
      properties:
        row:
          type: integer
          description: Line number in the file; the header is line 1.
        status:
          allOf:
          - $ref: '#/components/schemas/ImportRowStatusEnum'
          description: |-
            `skipped`: duplicate, not an error. `failed`: the row couldn't be imported (see `reason`).

            * `skipped` - skipped
            * `failed` - failed
        reason:
          type: string
          description: Human-readable explanation, safe to show.
      required:
      - reason
      - row
      - status
    ImportRowStatusEnum:
      enum:
      - skipped
      - failed
      type: string
      description: |-
        * `skipped` - skipped
        * `failed` - failed
    Insight:
      type: object
      properties:
        id:
          type: string
          description: Stable id of this observation (e.g. `budget_exceeded:21`);
            use it as a list key or to remember which insights the user dismissed.
        type:
          allOf:
          - $ref: '#/components/schemas/InsightTypeEnum'
          description: |-
            What was observed (see the table above).

            * `top_category` - top_category
            * `category_increase` - category_increase
            * `category_decrease` - category_decrease
            * `budget_exceeded` - budget_exceeded
            * `budget_warning` - budget_warning
            * `recurring_share` - recurring_share
            * `overspending` - overspending
            * `savings` - savings
        severity:
          allOf:
          - $ref: '#/components/schemas/InsightSeverityEnum'
          description: |-
            `alert` > `warning` > `positive` > `info`; the list is sorted by it.

            * `alert` - alert
            * `warning` - warning
            * `positive` - positive
            * `info` - info
        message:
          type: string
          description: English sentence for the user. Contains no currency symbol.
        category_id:
          type: integer
          nullable: true
          description: The category concerned, if any.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          description: The amount the insight is about (see the table); `null` if
            none.
        percentage:
          type: number
          format: double
          nullable: true
          description: The percentage the insight is about; `null` if none.
      required:
      - amount
      - category_id
      - id
      - message
      - percentage
      - severity
      - type
    InsightList:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
          description: Most urgent first. Empty when there is nothing to say.
      required:
      - insights
      - month
      - year
    InsightSeverityEnum:
      enum:
      - alert
      - warning
      - positive
      - info
      type: string
      description: |-
        * `alert` - alert
        * `warning` - warning
        * `positive` - positive
        * `info` - info
    InsightTypeEnum:
      enum:
      - top_category
      - category_increase
      - category_decrease
      - budget_exceeded
      - budget_warning
      - recurring_share
      - overspending
      - savings
      type: string
      description: |-
        * `top_category` - top_category
        * `category_increase` - category_increase
        * `category_decrease` - category_decrease
        * `budget_exceeded` - budget_exceeded
        * `budget_warning` - budget_warning
        * `recurring_share` - recurring_share
        * `overspending` - overspending
        * `savings` - savings
    Liveness:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: |-
            Always `ok`.

            * `ok` - ok
            * `error` - error
      required:
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Case-insensitive.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    MarkSeenResult:
      type: object
      properties:
        marked:
          type: integer
          description: How many unlocked achievements were new until now.
      required:
      - marked
    Merchant:
      type: object
      properties:
        merchant:
          type: string
          description: The most frequent spelling of the description.
        transaction_count:
          type: integer
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent at this merchant this month.
        average:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Average per transaction.
        share_percentage:
          type: number
          format: double
          nullable: true
          description: Share of the month's total expenses, 0–100.
        previous_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Spent at this merchant the month before.
        change_percentage:
          type: number
          format: double
          nullable: true
          description: Against the month before; `null` when nothing was spent there
            then.
        last_date:
          type: string
          format: date
          description: Most recent transaction this month.
      required:
      - average
      - change_percentage
      - last_date
      - merchant
      - previous_total
      - share_percentage
      - total
      - transaction_count
    Merchants:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: All expenses of the month, including those without a merchant.
        merchants:
          type: array
          items:
            $ref: '#/components/schemas/Merchant'
          description: Largest total first, at most `limit`.
      required:
      - merchants
      - month
      - total_expenses
      - year
    Message:
      type: object
      properties:
        detail:
          type: string
          description: Confirmation message.
      required:
      - detail
    MoneyMovementRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: How much to add or remove, in the goal's `currency` (whole
            numbers for HUF and JPY).
      required:
      - amount
    MonthSummary:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_income:
          type: string
          format: decimal
