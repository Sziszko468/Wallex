                  platform: android
                  name: Pixel 8
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: 'Token already known: updated.'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                Registered:
                  value:
                    id: 4
                    expo_push_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
                    platform: android
                    name: Pixel 8
                    is_active: true
                    last_seen_at: '2026-09-26T09:50:01.957921Z'
                    created_at: '2026-09-26T09:50:01.993330Z'
          description: New device registered.
        '400':
