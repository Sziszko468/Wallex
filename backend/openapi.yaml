    SavingsGoalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: What you're saving for, e.g. `Japan trip`.
          maxLength: 100
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency the money is saved in; both amounts are in it and never converted. Default: the user's base currency. Can only change while `current_amount` is 0.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'How much to save: positive, max 2 decimals (whole for HUF/JPY).'
        current_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Saved so far (default 0). Set it directly to correct it, or
            use the `deposit` / `withdraw` actions to add or remove money.
        target_date:
          type: string
          format: date
          nullable: true
          description: Optional deadline (`YYYY-MM-DD`); can't be set to a past date.
        status:
          allOf:
          - $ref: '#/components/schemas/SavingsGoalStatusEnum'
          description: |-
            `active`: still saving. `completed`: set by the server once `current_amount` reaches `target_amount` (and back to `active` if it drops below). `archived`: put away by the user. Send `archived` to archive and `active` to restore; `completed` can't be sent.

            * `active` - Active
            * `completed` - Completed
            * `archived` - Archived
      required:
      - name
      - target_amount
    SavingsGoalStatusEnum:
      enum:
      - active
      - completed
      - archived
      type: string
      description: |-
        * `active` - Active
        * `completed` - Completed
        * `archived` - Archived
    SavingsSummary:
      type: object
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The user's base currency: every total is in it.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        active_count:
          type: integer
        completed_count:
          type: integer
        archived_count:
          type: integer
        total_saved:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          readOnly: true
          description: Saved in the goals that aren't archived, in the base currency.
        total_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          readOnly: true
          description: Their targets added up, in the base currency.
        progress_percentage:
          type: number
          format: double
          nullable: true
          description: '`total_saved / total_target × 100`; `null` without such goals.'
        unconverted_currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyEnum'
          description: 'Currencies without an ECB rate of the last 7 days: goals saved
            in them are left out of the totals.'
      required:
      - active_count
      - archived_count
      - completed_count
      - currency
      - progress_percentage
      - total_saved
      - total_target
      - unconverted_currencies
    ScannedAmount:
      type: object
      properties:
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: The receipt total; `null` if not found.
        confidence:
          allOf:
          - $ref: '#/components/schemas/OcrConfidenceEnum'
          description: |-
            `high`: found by a specific rule (e.g. the TOTAL line). `low`: best guess — ask the user to check.

            * `high` - high
            * `low` - low
      required:
      - confidence
      - value
    ScannedCurrency:
      type: object
      properties:
        value:
          nullable: true
          description: |-
            Currency printed on the receipt (Ft/HUF, €, $, £, CHF, ¥); `null` if none of these was found.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/NullEnum'
        confidence:
          allOf:
          - $ref: '#/components/schemas/OcrConfidenceEnum'
          description: |-
            `low` when several currencies appear on the receipt, or none.

            * `high` - high
            * `low` - low
      required:
      - confidence
      - value
    ScannedDate:
      type: object
      properties:
        value:
          type: string
          format: date
          nullable: true
          description: Purchase date; `null` if not found.
        confidence:
          allOf:
          - $ref: '#/components/schemas/OcrConfidenceEnum'
          description: |-
            `high`: found by a specific rule (e.g. the TOTAL line). `low`: best guess — ask the user to check.

            * `high` - high
            * `low` - low
      required:
      - confidence
      - value
    ScannedText:
      type: object
      properties:
        value:
          type: string
          nullable: true
          description: '`null` if nothing usable was found.'
        confidence:
          allOf:
          - $ref: '#/components/schemas/OcrConfidenceEnum'
          description: |-
            `high`: found by a specific rule (e.g. the TOTAL line). `low`: best guess — ask the user to check.

            * `high` - high
            * `low` - low
      required:
      - confidence
      - value
    SpendingPatterns:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        days_counted:
          type: integer
          description: 'Days of the month included: all of a past month, 1st to today
            for the current month, 0 for a future one.'
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Expenses of the counted days.
        average_daily_spending:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          description: '`total_expenses / days_counted`; `null` with no days counted.'
        weekdays:
          type: array
          items:
            $ref: '#/components/schemas/WeekdaySpending'
          description: Always 7 entries, Monday first.
        fixed_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Expenses a recurring template accounts for (see the description).
        variable_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: '`total_expenses - fixed_expenses`.'
        fixed_percentage:
          type: number
          format: double
          nullable: true
          description: Share of fixed expenses; `null` without expenses.
        recurring_commitments:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: What the active recurring expense templates add up to per month
            (weekly × 52 / 12, yearly / 12).
      required:
      - average_daily_spending
      - days_counted
      - fixed_expenses
      - fixed_percentage
      - month
      - recurring_commitments
      - total_expenses
      - variable_expenses
      - weekdays
      - year
    Subscription:
      type: object
      description: |-
        What every recurring row needs, whichever endpoint writes it (recurring transactions,
        subscriptions): only the user's own categories, a consistent schedule, an amount valid
        in its currency, and the upkeep of next_occurrence_date. Subclasses define Meta.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the user calls it, e.g. `Netflix`, `Gym`, `Home insurance`.
          maxLength: 100
        merchant:
          type: string
          description: 'Optional: who bills it, e.g. `Netflix International B.V.`.'
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: 'Price of one payment in `currency`: positive, max 2 decimals
            (whole for HUF/JPY).'
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency the subscription is billed in. Default: the user's base currency. Never converted.

            * `EUR` - Euro
            * `HUF` - Hungarian forint
            * `USD` - US dollar
            * `GBP` - British pound
            * `JPY` - Japanese yen
            * `CHF` - Swiss franc
        category:
          type: integer
          description: Id of one of the user's **expense** categories.
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          description: |-
            Billing period, counted from `start_date`.

            * `weekly` - Weekly
            * `monthly` - Monthly
            * `yearly` - Yearly
        start_date:
          type: string
          format: date
          description: First payment; every later payment follows from it.
        end_date:
          type: string
          format: date
          nullable: true
          description: Last possible payment (inclusive), e.g. a cancelled plan; `null`
            = open-ended.
        next_payment_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The next payment on or after today, from `start_date` and `frequency`;
            `null` when paused or ended.
        active:
          type: boolean
          description: '`false` pauses the subscription: no payments ahead, left out
            of the totals. Default `true`.'
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
          description: |-
            `active`: has payments ahead. `paused`: `active` is `false`. `ended`: past its `end_date`.

            * `active` - active
            * `paused` - paused
            * `ended` - ended
        upcoming_payments:
          type: array
          items:
            type: string
            format: date
          readOnly: true
          description: The next 3 payment dates (fewer near `end_date`); empty when
            paused or ended.
        monthly_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Average cost per month in `currency` (weekly × 52 / 12, yearly
            / 12).
        yearly_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          description: Cost per year in `currency` (weekly × 52, monthly × 12).
        base_monthly_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: '`monthly_cost` in the user''s base currency at the latest
            ECB rate; `null` if no rate of the last 7 days.'
        base_yearly_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: '`yearly_cost` in the user''s base currency at the latest ECB
            rate; `null` if no rate of the last 7 days.'
        description:
          type: string
          description: Optional free text (plan, account, notes).
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - base_monthly_cost
      - base_yearly_cost
      - category
      - created_at
      - frequency
      - id
      - monthly_cost
      - name
      - next_payment_date
      - start_date
      - status
      - upcoming_payments
      - updated_at
      - yearly_cost
