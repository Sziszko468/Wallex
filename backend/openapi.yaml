          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next request is allowed.
    post:
      operationId: transactions_create
      description: |-
        `type` must equal the category's type; `amount` is positive with at most 2 decimals.

        **Idempotency:** send a `client_id` (UUID, generated once per transaction) to make retries safe. If a transaction with the same `client_id` already exists, it is returned with `200` and nothing new is created — the body of the retry is ignored.

        Creating an expense re-checks the month's budgets and may send a budget push notification.
      summary: Create a transaction
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              Expense:
                value:
                  amount: '45.90'
                  type: expense
                  category: 206
                  description: Monthly gym pass
                  date: '2026-09-12'
              Offline-safe(withClientId):
                value:
                  amount: '2500.00'
                  type: income
                  category: 9
                  description: Salary
                  date: '2026-09-01'
                  client_id: 3f2b7c1e-8a4d-4f6b-9c2e-1d5a7b9e0f13
                summary: Offline-safe (with client_id)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: 'Replay of an already stored `client_id`: the existing transaction.'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              examples:
                Created:
                  value:
                    id: 116
                    amount: '45.90'
                    type: expense
                    category: 206
                    description: Monthly gym pass
                    date: '2026-09-12'
                    client_id: null
                    created_at: '2026-09-26T09:49:57.360831Z'
                    updated_at: '2026-09-26T09:49:57.360857Z'
          description: Created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                TypeDiffersFromCategory:
                  value:
                    type:
                    - Transaction type must match the selected category's type.
                  summary: Type differs from category
                AmountTooSmall:
                  value:
                    amount:
                    - Ensure this value is greater than or equal to 0.01.
                  summary: Amount too small
                TooManyDecimals:
                  value:
                    amount:
                    - Ensure that there are no more than 2 decimal places.
                  summary: Too many decimals
                UnknownOrForeignCategory:
                  value:
                    category:
                    - Invalid pk "999999" - object does not exist.
                  summary: Unknown or foreign category
                BadDate:
                  value:
                    date:
                    - 'Date has wrong format. Use one of these formats instead: YYYY-MM-DD.'
                  summary: Bad date
                BadClientId:
                  value:
                    client_id:
                    - Must be a valid UUID.
                  summary: Bad client_id
                MissingFields:
                  value:
                    category:
                    - This field is required.
                    date:
                    - This field is required.
                  summary: Missing fields
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
