  /api/receipts/scan/:
    post:
      operationId: receipts_scan_create
      description: |-
        Reads a receipt photo with OCR (English and Hungarian) and **suggests** the merchant, total, date, currency, the purchased items and an expense category. Nothing is saved: show the suggestions to the user, let them confirm or correct them, then create the transaction with `POST /api/transactions/`.

        Each field comes with a confidence; fields that couldn't be read are `null`. `outcome` says which screen fits: review (`complete`, `incomplete`), or retake / enter manually (`unsupported`, `unreadable`). The OCR engine is configurable (`RECEIPT_OCR_PROVIDER`). The photo is processed in memory and discarded. Limited to 30 scans per hour per user.
      summary: Scan a receipt photo
      tags:
      - Receipt Scanning
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptImageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptScan'
              examples:
                GroceryReceipt:
                  value:
                    merchant:
                      value: SPAR Magyarorszag Kft
                      confidence: high
                    amount:
                      value: '1358.00'
                      confidence: high
                    date:
                      value: '2026-09-20'
                      confidence: high
                    currency:
                      value: HUF
                      confidence: high
                    unsupported_currency: null
                    items:
                    - name: KENYER
                      amount: '549.00'
                    - name: TEJ 2,8% 1L
                      amount: '399.00'
                    - name: BANAN
                      amount: '410.00'
                    category:
                      id: 2
                      name: Food
                      source: rules
                    text_found: true
                    outcome: complete
                  summary: Grocery receipt
                ReceiptInAnUnsupportedCurrency:
                  value:
                    merchant:
                      value: Albert Supermarket
                      confidence: low
                    amount:
                      value: '125.90'
                      confidence: high
                    date:
                      value: '2026-09-24'
                      confidence: high
                    currency:
                      value: null
                      confidence: low
                    unsupported_currency: CZK
                    items:
                    - name: Rohlik
                      amount: '12.90'
                    category: null
                    text_found: true
                    outcome: incomplete
                  summary: Receipt in an unsupported currency
                NotAReceipt:
                  value:
                    merchant:
                      value: Soup of the day
                      confidence: low
                    amount:
                      value: null
                      confidence: low
                    date:
                      value: null
                      confidence: low
                    currency:
                      value: null
                      confidence: low
                    unsupported_currency: null
                    items: []
                    category: null
                    text_found: true
                    outcome: unsupported
                  summary: Not a receipt
                UnreadablePhoto:
                  value:
                    merchant:
                      value: null
                      confidence: low
                    amount:
                      value: null
                      confidence: low
                    date:
                      value: null
                      confidence: low
                    currency:
                      value: null
                      confidence: low
                    unsupported_currency: null
                    items: []
                    category: null
                    text_found: false
                    outcome: unreadable
                  summary: Unreadable photo
          description: Suggestions (possibly partial).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoImage:
                  value:
                    image:
                    - This field is required.
                  summary: No image
                NotAnImage:
                  value:
                    image:
                    - The file is not a readable image.
                  summary: Not an image
                UnsupportedFormat:
                  value:
                    image:
                    - Please upload a JPEG or PNG photo.
                  summary: Unsupported format
                ResolutionTooHigh:
                  value:
                    image:
                    - The photo's resolution is too high.
                  summary: Resolution too high
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                TooLarge:
                  value:
                    image:
                    - The photo is too large (max 10 MB).
                  summary: Too large
          description: The upload is larger than 10 MB.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 42 seconds.
          description: Rate limit exceeded (30 scans per hour per user). Retry after
            the number of seconds in `Retry-After`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OCRDown:
                  value:
                    detail: Receipt scanning is temporarily unavailable. Please add
                      the transaction manually.
                  summary: OCR down
          description: The OCR engine is unavailable. Let the user enter the transaction
            manually.
