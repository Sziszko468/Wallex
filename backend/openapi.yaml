          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                UnknownCurrency:
                  value:
                    base_currency:
                    - '"XYZ" is not a valid choice.'
                  summary: Unknown currency
                RatesMissing:
                  value:
                    base_currency:
                    - No HUF exchange rate is available for 2019-03-04.
                  summary: Rates missing
          description: Validation failed; nothing was changed. See the examples for
            typical messages.
