  /api/transactions/:
    get:
      operationId: transactions_list
      description: The user's transactions, newest first, **paginated** (`count`,
        `next`, `previous`, `results`). All filters can be combined; `date_from` +
        `date_to` give a date range.
      summary: List transactions
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Category id; must be one of the user's categories.
      - in: query
        name: category_name
        schema:
          type: string
        description: Category name, exact match ignoring case (e.g. `food`).
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Only transactions on or after this date.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Only transactions on or before this date.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Sort by `date`, `amount` or `created_at`; prefix `-` for descending,
          comma-separate for several (`-amount,date`). Default: `-date,-created_at`
          (newest first). Unknown fields are ignored.'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page. Default 20, max 100.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring of `description`.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
        description: Only income or only expense transactions.
      tags:
      - Transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: One page of transactions.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidFilters:
                  value:
                    type:
                    - Select a valid choice. foo is not one of the available choices.
                    category:
                    - Select a valid choice. That choice is not one of the available
                      choices.
                    date_from:
                    - Enter a valid date.
                  summary: Invalid filters
          description: A filter value is invalid.
        '401':
          description: 'No valid access token: missing, malformed or expired. Refresh
            it with `POST /api/auth/refresh/` and retry once; if the refresh fails
            too, the user must log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    detail: Authentication credentials were not provided.
                InvalidOrExpiredToken:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: Token is expired
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PastTheEnd:
                  value:
                    detail: Invalid page.
                  summary: Past the end
          description: '`page` is past the last page.'
        '429':
          description: Rate limit exceeded (see *Rate limits* in the introduction).
