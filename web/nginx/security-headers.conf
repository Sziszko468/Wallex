# Security headers for the web app's own responses (Django sets its own for the API).
# Included in every location that serves the SPA: nginx drops server-level add_header
# directives inside any location that declares its own.

# Clickjacking: frame-ancestors can't be set from the <meta> CSP in index.html.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browsers ignore HSTS on plain-HTTP responses, so this only takes effect behind TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
