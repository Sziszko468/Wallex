# Request headers for every location proxied to Django (included by default.conf.template).
proxy_http_version 1.1;
# The public host name, port included: Django validates it against ALLOWED_HOSTS.
proxy_set_header Host $http_host;
# Append the client address; DRF_NUM_PROXIES tells Django how many hops to trust.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
